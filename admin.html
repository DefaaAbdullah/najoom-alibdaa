<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>لوحة إدارة نجوم الإبداع</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#06131f;
}

.admin-wrap{
    width:min(1450px,94%);
    margin:30px auto 80px;
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.admin-title h1{
    margin:0;
    color:#e4c57e;
}

.admin-title p{
    color:#9eabb4;
}

.admin-actions{
    display:flex;
    gap:10px;
}

.panel{
    background:#0b1f30;
    border:1px solid rgba(228,197,126,.15);
    border-radius:20px;
    padding:22px;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.tab-btn{
    border:1px solid rgba(228,197,126,.2);
    background:#071522;
    color:#ddd;
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
}

.tab-btn.active{
    background:#e4c57e;
    color:#071522;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#e4c57e;
    font-weight:700;
}

.field input,
.field select,
.field textarea{
    width:100%;
    background:#071522;
    border:1px solid rgba(228,197,126,.2);
    color:#fff;
    border-radius:10px;
    padding:12px;
    outline:none;
}

.field textarea{
    min-height:120px;
    resize:vertical;
}

.checks{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:10px;
}

.check{
    display:flex;
    align-items:center;
    gap:7px;
    color:#ddd;
}

.preview{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
}

.preview img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:10px;
}

.admin-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.admin-card{
    background:#071522;
    border:1px solid rgba(228,197,126,.15);
    border-radius:16px;
    overflow:hidden;
}

.admin-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.admin-card-body{
    padding:15px;
}

.admin-card h3{
    margin:0 0 8px;
}

.meta{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:10px;
}

.meta span{
    font-size:11px;
    padding:4px 7px;
    border-radius:7px;
    background:#102b40;
    color:#dbe4ea;
}

.admin-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.small-btn{
    border:0;
    border-radius:8px;
    padding:7px 10px;
    font-family:inherit;
    font-weight:700;
}

.edit{
    background:#e4c57e;
    color:#071522;
}

.hide{
    background:#7a2631;
    color:#fff;
}

.show{
    background:#267a55;
    color:#fff;
}

.delete{
    background:#8d1f1f;
    color:#fff;
}

.branch-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.branch-admin-card{
    background:#071522;
    padding:20px;
    border:1px solid rgba(228,197,126,.15);
    border-radius:15px;
    cursor:pointer;
}

.branch-admin-card.active{
    border-color:#e4c57e;
}

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}

.login-box{
    width:min(430px,100%);
    background:#0b1f30;
    border:1px solid rgba(228,197,126,.2);
    border-radius:20px;
    padding:30px;
}

.login-box h1{
    color:#e4c57e;
    text-align:center;
}

.hidden{
    display:none!important;
}

.notice{
    padding:12px 15px;
    background:#102b40;
    border-radius:10px;
    margin-bottom:15px;
    color:#ddd;
}

.danger{
    color:#ff7c7c;
}

@media(max-width:900px){

    .admin-list{
        grid-template-columns:repeat(2,1fr);
    }

    .branch-list{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .admin-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .admin-list{
        grid-template-columns:1fr;
    }

    .branch-list{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://kpgfdhxwcormlqfkpoye.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VYD0M_I_yrW-DlQUYhtvGQ_lUQcHwXG";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let editingProductId = null;

let allAdminProducts = [];

let selectedBranch = "tabuk";


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        message.classList.remove("hidden");

        message.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور";

        return;
    }


    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if(error){

        message.classList.remove("hidden");

        message.textContent =
            error.message;

        return;
    }


    await startAdmin();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =====================================================
   START
===================================================== */

async function startAdmin(){

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("adminScreen")
        .classList.remove("hidden");

    await loadProducts();

    await loadBranchImages();

}


/* =====================================================
   SESSION
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const {
            data:{
                session
            }
        } =
        await supabaseClient.auth.getSession();


        if(session){

            await startAdmin();

        }

    }
);


/* =====================================================
   TABS
===================================================== */

function showTab(tab){

    const products =
        document.getElementById("productsSection");

    const branches =
        document.getElementById("branchesSection");

    const productsTab =
        document.getElementById("productsTab");

    const branchesTab =
        document.getElementById("branchesTab");


    if(tab === "products"){

        products.classList.remove("hidden");
        branches.classList.add("hidden");

        productsTab.classList.add("active");
        branchesTab.classList.remove("active");

    }

    else{

        products.classList.add("hidden");
        branches.classList.remove("hidden");

        productsTab.classList.remove("active");
        branchesTab.classList.add("active");

        loadBranchImages();

    }

}


/* =====================================================
   PRODUCT LOAD
===================================================== */

async function loadProducts(){

    const list =
        document.getElementById("productsList");


    list.innerHTML =
        `<div class="empty">جاري تحميل المنتجات...</div>`;


    const { data, error } =
        await supabaseClient
        .from("tables")
        .select("*")
        .order("sort_order", {
            ascending:true
        })
        .order("created_at", {
            ascending:false
        });


    if(error){

        console.error(error);

        list.innerHTML =
            `<div class="empty">
                تعذر تحميل المنتجات
            </div>`;

        return;
    }


    allAdminProducts =
        data || [];

    renderAdminProducts();

}


/* =====================================================
   PRODUCT TYPE
===================================================== */

function adminProductType(product){

    if(product.product_type){
        return product.product_type;
    }

    return "sofa";
}


function adminProductTypeName(type){

    const names = {

        sofa:"كنبة / مجلس",

        table:"طاولة",

        dining_table:"طاولة طعام",

        chair:"كرسي",

        buffet:"بوفيه"

    };

    return names[type] || type;
}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderAdminProducts(){

    const list =
        document.getElementById("productsList");


    const search =
        document
        .getElementById("adminSearch")
        .value
        .trim()
        .toLowerCase();


    const type =
        document
        .getElementById("adminTypeFilter")
        .value;


    let products =
        allAdminProducts;


    if(search){

        products =
            products.filter(p =>

                String(p.name || "")
                .toLowerCase()
                .includes(search)

            );

    }


    if(type !== "all"){

        products =
            products.filter(p =>

                adminProductType(p) === type

            );

    }


    if(!products.length){

        list.innerHTML =
            `<div class="empty">
                لا توجد منتجات
            </div>`;

        return;
    }


    list.innerHTML =
        products.map(product => {

            const image =
                product.main_image_url ||
                "https://placehold.co/600x400/071522/e4c57e?text=No+Image";


            const published =
                product.published;


            const offer =
                product.offer_type === "discount"
                ? "خصم"
                : product.offer_type === "special"
                ? "عرض خاص"
                : "عادي";


            return `

            <div class="admin-card">

                <img
                    src="${image}"
                    alt="${product.name || ""}"
                >


                <div class="admin-card-body">

                    <h3>
                        ${product.name || "بدون اسم"}
                    </h3>


                    <div class="meta">

                        <span>
                            ${adminProductTypeName(
                                adminProductType(product)
                            )}
                        </span>

                        <span>
                            ${offer}
                        </span>

                        ${
                            product.is_new
                            ? `<span>جديد</span>`
                            : ""
                        }

                        ${
                            product.is_featured
                            ? `<span>مميز</span>`
                            : ""
                        }

                        <span>
                            ${
                                published
                                ? "منشور"
                                : "مخفي"
                            }
                        </span>

                    </div>


                    <div class="admin-buttons">

                        <button
                            class="small-btn edit"
                            onclick="editProduct('${product.id}')"
                        >
                            تعديل
                        </button>


                        <button
                            class="small-btn ${
                                published
                                ? "hide"
                                : "show"
                            }"
                            onclick="togglePublished(
                                '${product.id}',
                                ${published}
                            )"
                        >
                            ${
                                published
                                ? "إخفاء"
                                : "نشر"
                            }
                        </button>


                        <button
                            class="small-btn delete"
                            onclick="deleteProduct('${product.id}')"
                        >
                            حذف
                        </button>

                    </div>

                </div>

            </div>

            `;

        }).join("");

}


/* =====================================================
   SEARCH
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const search =
            document.getElementById("adminSearch");

        const type =
            document.getElementById("adminTypeFilter");


        if(search){
            search.addEventListener(
                "input",
                renderAdminProducts
            );
        }


        if(type){
            type.addEventListener(
                "change",
                renderAdminProducts
            );
        }

    }
);


/* =====================================================
   UPLOAD PRODUCT IMAGE
===================================================== */

async function uploadProductImage(file){

    if(!file){
        return null;
    }


    const safeName =
        file.name
        .replace(/[^a-zA-Z0-9\u0600-\u06FF._-]/g,"-");


    const path =
        `products/${Date.now()}-${safeName}`;


    const { error } =
        await supabaseClient
        .storage
        .from("table-images")
        .upload(path, file, {
            upsert:false
        });


    if(error){

        throw error;

    }


    const {
        data
    } =
    supabaseClient
    .storage
    .from("table-images")
    .getPublicUrl(path);


    return data.publicUrl;

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(){

    const message =
        document.getElementById("productMessage");


    try{

        const name =
            document.getElementById("productName")
            .value.trim();


        if(!name){

            throw new Error(
                "اسم المنتج مطلوب"
            );

        }


        const mainFile =
            document.getElementById("mainImage")
            .files[0];


        const extraFiles =
            Array.from(
                document.getElementById("extraImages")
                .files
            );


        let mainImageUrl = null;

        let extraImageUrls = [];


        /*
          إذا كان تعديل بدون رفع صورة
          نحافظ على الصورة القديمة
        */

        if(editingProductId){

            const oldProduct =
                allAdminProducts.find(
                    p => p.id === editingProductId
                );


            if(oldProduct){

                mainImageUrl =
                    oldProduct.main_image_url || null;

                extraImageUrls =
                    Array.isArray(
                        oldProduct.extra_image_urls
                    )
                    ? oldProduct.extra_image_urls
                    : [];

            }

        }


        if(mainFile){

            mainImageUrl =
                await uploadProductImage(
                    mainFile
                );

        }


        for(const file of extraFiles){

            const url =
                await uploadProductImage(file);

            if(url){
                extraImageUrls.push(url);
            }

        }


        const payload = {

            name,

            category:
                document
                .getElementById("category")
                .value
                .trim(),

            product_type:
                document
                .getElementById("productType")
                .value,

            offer_type:
                document
                .getElementById("offerType")
                .value,

            description:
                document
                .getElementById("description")
                .value
                .trim(),

            dimensions:
                document
                .getElementById("dimensions")
                .value
                .trim(),

            material:
                document
                .getElementById("material")
                .value
                .trim(),

            color:
                document
                .getElementById("color")
                .value
                .trim(),

            sort_order:
                Number(
                    document
                    .getElementById("sortOrder")
                    .value
                ) || 0,

            published:
                document
                .getElementById("published")
                .value === "true",

            whatsapp:
                document
                .getElementById("whatsapp")
                .value
                .trim(),

            is_new:
                document
                .getElementById("isNew")
                .checked,

            is_featured:
                document
                .getElementById("isFeatured")
                .checked,

            main_image_url:
                mainImageUrl,

            extra_image_urls:
                extraImageUrls

        };


        let result;


        if(editingProductId){

            result =
                await supabaseClient
                .from("tables")
                .update(payload)
                .eq("id", editingProductId);

        }

        else{

            result =
                await supabaseClient
                .from("tables")
                .insert(payload);

        }


        if(result.error){

            throw result.error;

        }


        message.classList.remove("hidden");

        message.textContent =
            editingProductId
            ? "تم تحديث المنتج بنجاح"
            : "تم إضافة المنتج بنجاح";


        resetProductForm();

        await loadProducts();


    }
    catch(error){

        console.error(error);

        message.classList.remove("hidden");

        message.textContent =
            "حدث خطأ: " +
            error.message;

    }

}


/* =====================================================
   EDIT
===================================================== */

function editProduct(id){

    const product =
        allAdminProducts.find(
            p => p.id === id
        );


    if(!product){
        return;
    }


    editingProductId =
        id;


    document
        .getElementById("productName")
        .value =
        product.name || "";


    document
        .getElementById("productType")
        .value =
        product.product_type || "sofa";


    document
        .getElementById("offerType")
        .value =
        product.offer_type || "normal";


    document
        .getElementById("category")
        .value =
        product.category || "";


    document
        .getElementById("sortOrder")
        .value =
        product.sort_order || 0;


    document
        .getElementById("published")
        .value =
        String(
            product.published !== false
        );


    document
        .getElementById("dimensions")
        .value =
        product.dimensions || "";


    document
        .getElementById("material")
        .value =
        product.material || "";


    document
        .getElementById("color")
        .value =
        product.color || "";


    document
        .getElementById("whatsapp")
        .value =
        product.whatsapp || "";


    document
        .getElementById("description")
        .value =
        product.description || "";


    document
        .getElementById("isNew")
        .checked =
        product.is_new === true;


    document
        .getElementById("isFeatured")
        .checked =
        product.is_featured === true;


    const preview =
        document.getElementById(
            "imagePreview"
        );


    const images = [

        product.main_image_url,

        ...(Array.isArray(
            product.extra_image_urls
        )
        ? product.extra_image_urls
        : [])

    ].filter(Boolean);


    preview.innerHTML =
        images
        .map(url => `
            <img
                src="${url}"
                alt=""
            >
        `)
        .join("");


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* =====================================================
   BRANCH SELECT
===================================================== */

function selectBranch(branch){

    selectedBranch =
        branch;


    document
        .querySelectorAll(
            ".branch-admin-card"
        )
        .forEach(card => {

            card.classList.toggle(
                "active",
                card.dataset.branch === branch
            );

        });


    loadBranchImages();

}


/* =====================================================
   BRANCH IMAGE UPLOAD
===================================================== */

async function uploadBranchImages(){

    const message =
        document.getElementById(
            "branchMessage"
        );


    try{

        const files =
            Array.from(
                document
                .getElementById("branchImages")
                .files
            );


        if(!files.length){

            throw new Error(
                "اختر صورة واحدة على الأقل"
            );

        }


        const title =
            document
            .getElementById("branchTitle")
            .value
            .trim();


        const sort =
            Number(
                document
                .getElementById("branchSort")
                .value
            ) || 0;


        const published =
            document
            .getElementById("branchPublished")
            .value === "true";


        for(const file of files){

            const safeName =
                file.name
                .replace(
                    /[^a-zA-Z0-9\u0600-\u06FF._-]/g,
                    "-"
                );


            const path =
                `branches/${selectedBranch}/${Date.now()}-${Math.random().toString(36).slice(2)}-${safeName}`;


            const upload =
                await supabaseClient
                .storage
                .from("branch-images")
                .upload(
                    path,
                    file,
                    {
                        upsert:false
                    }
                );


            if(upload.error){

                throw upload.error;

            }


            const {
                data:urlData
            } =
            supabaseClient
            .storage
            .from("branch-images")
            .getPublicUrl(path);


            const imageUrl =
                urlData.publicUrl;


            const insert =
                await supabaseClient
                .from("branch_images")
                .insert({

                    branch:
                        selectedBranch,

                    title,

                    image_url:
                        imageUrl,

                    storage_path:
                        path,

                    sort_order:
                        sort,

                    published

                });


            if(insert.error){

                throw insert.error;

            }

        }


        message.classList.remove(
            "hidden"
        );

        message.textContent =
            "تم رفع الصور بنجاح";


        document
            .getElementById("branchImages")
            .value = "";


        await loadBranchImages();

    }
    catch(error){

        console.error(error);

        message.classList.remove(
            "hidden"
        );

        message.textContent =
            "حدث خطأ: " +
            error.message;

    }

}


/* =====================================================
   LOAD BRANCH IMAGES
===================================================== */

async function loadBranchImages(){

    const list =
        document.getElementById(
            "branchImagesList"
        );


    if(!list){
        return;
    }


    list.innerHTML =
        `<div class="empty">
            جاري تحميل صور الفرع...
        </div>`;


    const { data,error } =
        await supabaseClient
        .from("branch_images")
        .select("*")
        .eq("branch",selectedBranch)
        .order("sort_order",{
            ascending:true
        })
        .order("created_at",{
            ascending:false
        });


    if(error){

        list.innerHTML =
            `<div class="empty">
                ${error.message}
            </div>`;

        return;
    }


    if(!data || !data.length){

        list.innerHTML =
            `<div class="empty">
                لا توجد صور لهذا الفرع
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(image => {

            return `

            <div class="admin-card">

                <img
                    src="${image.image_url}"
                    alt="${image.title || ""}"
                >


                <div class="admin-card-body">

                    <h3>
                        ${
                            image.title ||
                            "صورة الفرع"
                        }
                    </h3>


                    <div class="meta">

                        <span>
                            الترتيب:
                            ${image.sort_order || 0}
                        </span>

                        <span>
                            ${
                                image.published
                                ? "منشور"
                                : "مخفي"
                            }
                        </span>

                    </div>


                    <div class="admin-buttons">

                        <button
                            class="small-btn ${
                                image.published
                                ? "hide"
                                : "show"
                            }"
                            onclick="
                                toggleBranchImage(
                                    '${image.id}',
                                    ${image.published}
                                )
                            "
                        >
                            ${
                                image.published
                                ? "إخفاء"
                                : "نشر"
                            }
                        </button>


                        <button
                            class="small-btn delete"
                            onclick="
                                deleteBranchImage(
                                    '${image.id}',
                                    '${image.storage_path || ""}'
                                )
                            "
                        >
                            حذف
                        </button>

                    </div>

                </div>

            </div>

            `;

        }).join("");

}


/* =====================================================
   TOGGLE BRANCH IMAGE
===================================================== */

async function toggleBranchImage(
    id,
    current
){

    const { error } =
        await supabaseClient
        .from("branch_images")
        .update({
            published:!current
        })
        .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    await loadBranchImages();

}


/* =====================================================
   DELETE BRANCH IMAGE
===================================================== */

async function deleteBranchImage(
    id,
    storagePath
){

    const ok =
        confirm(
            "هل أنت متأكد من حذف الصورة؟"
        );


    if(!ok){
        return;
    }


    if(storagePath){

        await supabaseClient
        .storage
        .from("branch-images")
        .remove([
            storagePath
        ]);

    }


    const { error } =
        await supabaseClient
        .from("branch_images")
        .delete()
        .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    await loadBranchImages();

}
