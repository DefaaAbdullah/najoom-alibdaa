        currentDesignImage &&
        imageToSend === currentDesignImage &&
        isDesignFollowUp(message)
    ){

    }

    if(message){

        aiHistory.push({

            role:"user",

            content:message

        });

    }else{

        aiHistory.push({

            role:"user",

            content:"[صورة مرفقة للتحليل]"

        });

    }

    saveAIHistory();

    input.value = "";

    autoResizeTextarea(input);

    removeSelectedImage();

    sendButton.disabled = true;

    addTyping();

    try{

        const bodyData = {

            message:
                message || "حلل الصورة المرفقة.",

            history:
                aiHistory.slice(-30),

            image:
                imageToSend || null,

            image_type:
                imageTypeToSend || null

        };

        const response =
            await fetch(
                "/api/chat",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(bodyData)

                }
            );

        if(!response.ok){

            throw new Error(
                "API Error: " +
                response.status
            );

        }

        const data =
            await response.json();

        removeTyping();

        const reply =
            data.reply ||
            data.message ||
            data.content ||
            data.output_text ||
            "عذرًا، لم أتمكن من الحصول على رد الآن.";

        aiHistory.push({

            role:"assistant",

            content:reply

        });

        saveAIHistory();

        addAIMessage(
            reply,
            "bot",
            true
        );

        const generatedImage =
            data.image_url ||
            data.image ||
            data.design_image ||
            data.designImage ||
            data.generated_image_url ||
            data.generated_image ||
            null;

        if(generatedImage){

            currentDesignImage =
                generatedImage;

            addDesignImage(
                generatedImage,
                data.design_prompt ||
                data.designPrompt ||
                "تصور تصميمي من مستشار نجوم الإبداع"
            );

        }

    }catch(error){

        removeTyping();

        const errorMessage =
            "عذرًا، المستشار غير متاح حاليًا. تأكد من تشغيل /api/chat أو تواصل معنا عبر واتساب.";

        addAIMessage(
            errorMessage,
            "bot",
            true
        );

        console.error(
            "AI ERROR:",
            error
        );

    }

    sendButton.disabled = false;

}

/* =====================================================
   SAVE GENERATED IMAGE
===================================================== */

async function saveAIImage(imageUrl){

    try{

        const response =
            await fetch(imageUrl);

        const blob =
            await response.blob();

        const objectUrl =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href =
            objectUrl;

        link.download =
            "تصميم-نجوم-الإبداع-" +
            new Date()
                .toISOString()
                .replace(/[:.]/g,"-") +
            ".png";

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(
            () => URL.revokeObjectURL(objectUrl),
            1500
        );

    }catch(error){

        try{

            const link =
                document.createElement("a");

            link.href =
                imageUrl;

            link.download =
                "تصميم-نجوم-الإبداع.png";

            link.target =
                "_blank";

            document.body.appendChild(link);

            link.click();

            link.remove();

        }catch(fallbackError){

            console.error(
                "SAVE IMAGE ERROR:",
                fallbackError
            );

            alert(
                "تعذر حفظ الصورة تلقائيًا. اضغط مطولًا على الصورة واختر حفظ الصورة."
            );

        }

    }

}


/* =====================================================
   VOICE / SPEECH SYNTHESIS
===================================================== */

function stopCurrentSpeech(){

    if(
        "speechSynthesis" in window
    ){

        window.speechSynthesis.cancel();

    }

    if(activeSpeechButton){

        activeSpeechButton.classList.remove(
            "playing"
        );

        activeSpeechButton.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';

    }

    activeSpeechButton = null;

    activeUtterance = null;

}


/* =====================================================
   SPEAK MESSAGE
===================================================== */

function speakMessage(button){

    const wrap =
        button.closest(
            ".ai-bubble-wrap"
        );

    if(!wrap){

        return;

    }

    const bubble =
        wrap.querySelector(
            ".ai-message.bot"
        );

    if(!bubble){

        return;

    }

    const text =
        bubble.textContent.trim();

    if(!text){

        return;

    }

    if(
        activeSpeechButton === button &&
        window.speechSynthesis.speaking
    ){

        stopCurrentSpeech();

        return;

    }

    stopCurrentSpeech();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "ar-SA";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    const voices =
        window.speechSynthesis.getVoices();

    const arabicVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("ar")
        );

    if(arabicVoice){

        utterance.voice =
            arabicVoice;

    }

    activeSpeechButton =
        button;

    activeUtterance =
        utterance;

    button.classList.add(
        "playing"
    );

    button.innerHTML =
        '<i class="fa-solid fa-stop"></i>';

    utterance.onend =
        function(){

            if(
                activeSpeechButton === button
            ){

                button.classList.remove(
                    "playing"
                );

                button.innerHTML =
                    '<i class="fa-solid fa-volume-high"></i>';

                activeSpeechButton = null;

                activeUtterance = null;

            }

        };

    utterance.onerror =
        function(){

            stopCurrentSpeech();

        };

    window.speechSynthesis.speak(
        utterance
    );

}

if(
    "speechSynthesis" in window
){

    window.speechSynthesis.onvoiceschanged =
        function(){

            window.speechSynthesis.getVoices();

        };

}

        );

        console.error(error);

    }

}


/* =====================================================
   MICROPHONE RECORDING
===================================================== */

async function toggleRecording(){

    if(isRecording){

        stopRecording();

        return;

    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        addAIMessage(
            "المتصفح لا يدعم تسجيل الصوت.",
            "bot",
            true
        );

        return;

    }

    try{

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });

        recordedChunks = [];

        mediaRecorder =
            new MediaRecorder(stream);

        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async function(){

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const audioBlob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                await sendAudioToAI(
                    audioBlob
                );

            };

        mediaRecorder.start();

        isRecording = true;

        const mic =
            document.getElementById(
                "aiMicButton"
            );

        mic.classList.add(
            "recording"
        );

        mic.innerHTML =
            '<i class="fa-solid fa-stop"></i>';

    }catch(error){

        console.error(
            "MIC ERROR:",
            error
        );

        addAIMessage(
            "لم أتمكن من الوصول إلى الميكروفون. تأكد من السماح للموقع باستخدام الميكروفون.",
            "bot",
            true
        );

    }

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.stop();

    }

    isRecording = false;

    const mic =
        document.getElementById(
            "aiMicButton"
        );

    mic.classList.remove(
        "recording"
    );

    mic.innerHTML =
        '<i class="fa-solid fa-microphone"></i>';

}


/* =====================================================
   SEND AUDIO
===================================================== */

async function sendAudioToAI(
    audioBlob
){

    addAIMessage(
        "تم تسجيل الصوت، جاري فهمه...",
        "user",
        false
    );

    addTyping();

    try{

        const formData =
            new FormData();

        formData.append(
            "audio",
            audioBlob,
            "voice.webm"
        );

        formData.append(
            "history",
            JSON.stringify(
                aiHistory.slice(-30)
            )
        );

        const response =
            await fetch(
                "/api/speech",
                {
                    method:"POST",
                    body:formData
                }
            );

        if(!response.ok){

            throw new Error(
                "Speech API Error"
            );

        }

        const data =
            await response.json();

        removeTyping();

        const transcript =
            data.transcript ||
            data.text ||
            data.message;

        if(transcript){

            aiHistory.push({

                role:"user",

                content:transcript

            });

            saveAIHistory();

        }

        const reply =
            data.reply ||
            data.content ||
            data.output_text ||
            "تم استلام الصوت، لكن لم يصل رد المستشار.";

        aiHistory.push({

            role:"assistant",

            content:reply

        });

        saveAIHistory();

        addAIMessage(
            reply,
            "bot",
            true
        );

    }catch(error){

        removeTyping();

        addAIMessage(
            "تعذر معالجة التسجيل الصوتي حاليًا. تأكد من وجود /api/speech في الخادم.",
            "bot",
            true
        );

        console.error(
            "SPEECH ERROR:",
            error
        );

    }

}
